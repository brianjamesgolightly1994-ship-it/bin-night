name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Bundle the web app into the APK
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html manifest.webmanifest icon-192.png icon-512.png apple-touch-icon.png android/app/src/main/assets/

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk BinNight.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BinNight-apk
          path: BinNight.apk

      - name: Publish as the latest download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Bin Night for Android
          body: |
            Download BinNight.apk on your Android phone and open it to install.
            bins.ics adds the same collections to Google Calendar with a 7pm reminder the night before.
          files: |
            BinNight.apk
            bins.ics
          make_latest: true
