plugins {
    id "com.android.application"
}

android {
    namespace "uk.binnight.app"
    compileSdk 34

    defaultConfig {
        applicationId "uk.binnight.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs directly without a Play Store account
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.11.0"
}
